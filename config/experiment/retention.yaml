# @package _global_
# Pruning-aware fine-tuning and retention evaluation of the OLP-H + reliability
# model. scripts/run_retention.py fills in paths, schedule and retention settings.
defaults:
  - /dataset@_group_.re10k: re10k
  - override /model/encoder: noposplat
  - override /model/encoder/backbone: croco
  - override /loss: [mse, lpips]

wandb:
  name: retention
model:
  encoder:
    gs_params_head_type: dpt_gs
    pose_free: true
    intrinsics_embed_loc: encoder
    intrinsics_embed_type: token
    pretrained_weights: ???
    orthogonal_preconditioner:
      enabled: true
      mix: 1.0
      target_mix: 1.0
      warmup_steps: 0
      seed: 0
    gaussian_reliability:
      enabled: true
      detach_gate: false
  decoder:
    make_scale_invariant: true
  gaussian_retention:
    enabled: false
    score_source: r_filter
    keep_ratio: 0.5
    cell_size: 2
    r_threshold: 0.35
train:
  # Scalar metrics and comparison images remain enabled. Videos are opt-in.
  validation_videos: false
optimizer:
  lr: 0.00002
  warm_up_steps: 125
  backbone_lr_multiplier: 0.1
checkpointing:
  load: null
  every_n_train_steps: 500
data_loader:
  train:
    batch_size: 1
    num_workers: 0
    persistent_workers: false
  val:
    num_workers: 0
    persistent_workers: false
trainer:
  max_steps: 5000
  num_sanity_val_steps: 0
  val_check_interval: 500
